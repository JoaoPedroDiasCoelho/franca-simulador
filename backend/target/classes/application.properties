spring.application.name=franca-simulador-api
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

# Servidor
server.port=${PORT:8080}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Conexão direta com o Railway (com senha e URL explícitas)
spring.datasource.url=jdbc:postgresql://maglev.proxy.rlwy.net:46013/railway
spring.datasource.username=postgres
spring.datasource.password=OYfinGlwSktzwuZTgfGDXDzLejyHQxnm
spring.datasource.driver-class-name=org.postgresql.Driver

# Limite para upload de imagens de motos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


# Parâmetros padrão de simulação didática (controladas pelo servidor)
simulador.financiamento.taxa-juros-mensal-padrao=1.89
simulador.financiamento.calculadora-url=${MATHJS_API_URL:https://api.mathjs.org/v4/}
simulador.consorcio.taxa-adm-total-padrao=15.00
simulador.consorcio.fundo-reserva-padrao=2.00
simulador.limites.prazo-minimo-meses=6
simulador.limites.prazo-maximo-meses=72
