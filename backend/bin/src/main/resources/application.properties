spring.application.name=franca-simulador-api

# Servidor
server.port=${SERVER_PORT:8080}

# Conexão com o PostgreSQL configurável por variáveis de ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/franca_simulador_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1206}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (validação via Flyway, sem auto-update em produção)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Parâmetros padrão de simulação didática (controladas pelo servidor)
simulador.financiamento.taxa-juros-mensal-padrao=1.89
simulador.consorcio.taxa-adm-total-padrao=15.00
simulador.consorcio.fundo-reserva-padrao=2.00
simulador.limites.prazo-minimo-meses=6
simulador.limites.prazo-maximo-meses=72
